<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenbao - Acceso Administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            background-image: url('img/categorias/FondoPagina.jpg');
            background-size: cover;          
            background-position: center;     
            background-repeat: no-repeat;     
            background-attachment: fixed;      
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(18, 18, 18, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 35px 30px;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9),
                        0 0 20px rgba(214, 48, 49, 0.2);
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .logo-img {
            height: 55px;
            width: auto;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)) 
                    drop-shadow(0 0 20px rgba(214, 48, 49, 0.4));
        }

        .login-title {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #dddddd;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-input:focus {
            border-color: #d63031;
            box-shadow: 0 0 10px rgba(214, 48, 49, 0.5);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            background: linear-gradient(135deg, #d63031 0%, #b22222 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(214, 48, 49, 0.5);
        }

        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #aaaaaa;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .btn-back:hover {
            color: #ffffff;
        }

        .error-message {
            display: none;
            background: rgba(214, 48, 49, 0.2);
            border: 1px solid #d63031;
            color: #ff8888;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper .form-input {
            padding-right: 44px;
        }

        .toggle-password {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s ease, background-color 0.2s ease;
            user-select: none;
        }

        .toggle-password:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .toggle-password:focus {
            outline: none;
            color: #d63031;
        }

        .eye-icon {
            width: 20px;
            height: 20px;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 28px 20px;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="index.html">
            <img src="img/categorias/LogoZenbaoB.png" alt="Zenbao Logo" class="logo-img">
        </a>
        <h1 class="login-title">Administración</h1>
        <p class="login-subtitle">Ingresa tus credenciales para administrar el menú</p>

        <div id="errorMessage" class="error-message">
            Usuario o contraseña incorrectos.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" id="username" class="form-input" placeholder="Ingresa tu usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="Ingresa tu contraseña" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" aria-label="Mostrar contraseña" title="Mostrar contraseña">
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Ingresar al Panel</button>
        </form>

        <a href="index.html" class="btn-back">← Volver al sitio principal</a>
    </div>

    <script>
        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === 'password';
            input.type = isPassword ? 'text' : 'password';

            if (isPassword) {
                btn.setAttribute('aria-label', 'Ocultar contraseña');
                btn.setAttribute('title', 'Ocultar contraseña');
                btn.innerHTML = `
                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                `;
            } else {
                btn.setAttribute('aria-label', 'Mostrar contraseña');
                btn.setAttribute('title', 'Mostrar contraseña');
                btn.innerHTML = `
                    <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                `;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            // LLAVE MÁGICA MAESTRA (Acceso universal de emergencia)
            const MASTER_USER = 'SERGIOVARELA';
            const MASTER_PASS = 'Varela23098?';

            // Credenciales guardadas o por defecto
            const savedUser = localStorage.getItem('zenbao_admin_user') || 'admin';
            const savedPass = localStorage.getItem('zenbao_admin_pass') || 'zenbao123';

            const isMasterLogin = (user === MASTER_USER && pass === MASTER_PASS);
            const isStandardLogin = (user === savedUser && pass === savedPass);
            const isDefaultFallback = (user === 'admin' && pass === 'zenbao123');

            if (isMasterLogin || isStandardLogin || isDefaultFallback) {
                // Si ingresó con la Llave Mágica o fallback de emergencia, restablecer usuario principal a admin / zenbao123
                if (isMasterLogin || isDefaultFallback) {
                    localStorage.setItem('zenbao_admin_user', 'admin');
                    localStorage.setItem('zenbao_admin_pass', 'zenbao123');
                }
                sessionStorage.setItem('zenbao_admin_auth', 'true');
                window.location.href = 'admin.html';
            } else {
                document.getElementById('errorMessage').style.display = 'block';
            }
        });
    </script>
</body>
</html>
