<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenbao - Categorías</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* RESET GENERAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            background-image: url('img/categorias/FondoPagina.jpg');
            background-size: 100% auto;          
            background-position: top center;     
            background-repeat: repeat-y;     
            background-attachment: scroll;      
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            padding-bottom: 40px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            body {
                background-size: contain; 
                background-position: top center;
            }
        }  

        /* HEADER FIJO MÁS DELGADO Y ELEGANTE */
        .menu-header {
            width: 100%;
            padding: 4px 0; /* Padding mínimo para reducir la barra al máximo */
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(20, 20, 20, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .header-logo {
            height: 32px; /* Reducido a la mitad para evitar que se vea tosco */
            width: auto;
            max-width: 90vw;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2)) 
                    drop-shadow(0 0 20px rgba(220, 20, 60, 0.3));
            transition: height 0.3s ease;
        }

        /* TÍTULO DE SECCIÓN */
        .section-title-container {
            text-align: center;
            margin: 25px 0 20px 0;
        }

        .section-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .title-underline {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #888888, #ffffff, #888888, transparent);
            margin: 8px auto 0 auto;
        }

        /* CONTENEDOR DE CATEGORÍAS */
        .categories-container {
            max-width: 650px;
            margin: 0 auto;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* TARJETAS BASE */
        .category-card {
            position: relative;
            width: 100%;
            height: 140px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            text-decoration: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .category-card:hover {
            transform: translateY(-3px);
            border-color: #d63031;
            box-shadow: 0 6px 20px rgba(214, 48, 49, 0.4);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.8) 100%);
            transition: background 0.3s ease;
        }

        .category-card:hover .card-overlay {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.7) 100%);
        }

        .card-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* NEÓN PLATEADO MÁS SUAVE Y ELEGANTE */
        .category-name {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #dcdcdc 60%, #b0b0b0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
                    drop-shadow(0 0 6px rgba(255, 255, 255, 0.4));
            transition: filter 0.3s ease;
        }

        .category-card:hover .category-name {
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
                    drop-shadow(0 0 10px rgba(255, 255, 255, 0.7));
        }

        /* TARJETA DORADA (ESPECIALIDADES) */
        .category-card.card-specialty {
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .category-card.card-specialty:hover {
            border-color: #fff099;
            box-shadow: 0 0 22px rgba(255, 215, 0, 0.5);
        }

        .category-card.card-specialty .category-name {
            background: linear-gradient(180deg, #fff3b3 0%, #ffd700 60%, #d4ac0d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.9))
                    drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
        }

        .specialty-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ffd700;
            margin-bottom: 4px;
            text-shadow: 0 0 6px rgba(255, 215, 0, 0.6);
        }

        /* MÓVILES */
        @media (max-width: 480px) {
            .header-logo {
                height: 38px; /* Ajustado para que no se ensanche la barra en celulares */
            }
            .category-card {
                height: 125px;
            }
            .category-name {
                font-size: 1.35rem;
            }
            .section-title {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ENCABEZADO CON LOGO Y BARRA FIJA SLIM -->
    <header class="menu-header">
        <a href="index.html">
            <img src="img/categorias/LogoZenbaoB.png" alt="Zenbao Logo" class="header-logo">
        </a>
    </header>

    <div class="section-title-container">
        <h2 class="section-title"></h2>
        <div class="title-underline"></div>
    </div>

    <!-- TARJETAS DE CATEGORÍAS -->
    <main class="categories-container">

        <!-- 1. ESPECIALIDADES (DORADA) -->
        <a href="especialidades.html" class="category-card card-specialty" style="background-image: url('img/categorias/especialidades.jpg');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <span class="specialty-badge">★ Lo Mejor de Zenbao</span>
                <h3 class="category-name">Especialidades</h3>
            </div>
        </a>

        <!-- 2. ENTRADAS -->
        <a href="entradas.html" class="category-card" style="background-image: url('img/categorias/entradas.jpg');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <h3 class="category-name">Entradas</h3>
            </div>
        </a>

        <!-- 3. CLÁSICOS -->
        <a href="clasicos.html" class="category-card" style="background-image: url('img/categorias/Clasicos.jpg');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <h3 class="category-name">Clásicos</h3>
            </div>
        </a>

        <!-- 4. NATURALES -->
        <a href="naturales.html" class="category-card" style="background-image: url('img/categorias/Natural.jpg');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <h3 class="category-name">Naturales</h3>
            </div>
        </a>

        <!-- 5. HORNEADOS -->
        <a href="horneados.html" class="category-card" style="background-image: url('img/categorias/Horno.jpg');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <h3 class="category-name">Horneados</h3>
            </div>
        </a>

        <!-- 6. BONELESS Y ALITAS -->
        <a href="boneless.html" class="category-card" style="background-image: url('img/categorias/Boneles.jpg');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <h3 class="category-name">Boneless y Alitas</h3>
            </div>
        </a>

        <!-- 7. BEBIDAS -->
        <a href="bebidas.html" class="category-card" style="background-image: url('https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?q=80&w=800');">
            <div class="card-overlay"></div>
            <div class="card-content">
                <h3 class="category-name">Bebidas</h3>
            </div>
        </a>

    </main>

</body>
</html>
