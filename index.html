<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenbao - Bienvenida</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* RESET GENERAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            background-image: url('img/FondoPagina.png');
            background-size: 100% auto;          
            background-position: top center;     
            background-repeat: repeat-y;     
            background-attachment: scroll;      
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: pointer; /* Indica visualmente que toda la pantalla es cliqueable */
        }

        @media (max-width: 768px) {
            body {
                background-size: contain; 
                background-position: top center;
            }
        }       

        /* CONTENEDOR PRINCIPAL */
        .welcome-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 500px;
            width: 100%;
            /* Animación de entrada suave con difuminado */
            animation: fadeInBlur 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* LOGO */
        .logo-box {
            position: relative;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            position: relative;
            z-index: 2;
            width: 260px;
            height: auto;
            object-fit: contain;
        }

        /* BOTÓN DE MENÚ (TEXTO PURO SIN CÁPSULA NI BORDE ROJO) */
        .btn-menu {
            position: relative;
            z-index: 2;
            display: inline-block;
            padding: 10px 20px;
            border: none;
            background: transparent; /* Sin fondo negro */
            color: #ffffff;
            font-family: 'Cinzel', serif;
            font-size: 1.65rem;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 5px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            cursor: pointer;
            
            /* LUZ LED DIRECTAMENTE EN LAS LETRAS DEL TEXTO */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                         0 0 20px rgba(214, 48, 49, 0.8),
                         0 0 35px rgba(214, 48, 49, 0.6);
        }

        /* EFECTO HOVER */
        .btn-menu:hover {
            color: #ffffff;
            transform: scale(1.08);
            /* Intensificación de luz neón en las letras al pasar el cursor */
            text-shadow: 0 0 12px #ffffff,
                         0 0 25px #d63031,
                         0 0 45px #d63031,
                         0 0 60px #d63031;
        }

        /* ANIMACIÓN DE ENTRADA */
        @keyframes fadeInBlur {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        /* MÓVILES */
        @media (max-width: 480px) {
            .logo-img {
                width: 210px;
            }
            .logo-box {
                margin-bottom: 25px;
            }
            .btn-menu {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body>

    <main class="welcome-container">
        <div class="welcome-content">
            
            <div class="logo-box">
                <img src="img/LogoZenbaoB.png" alt="Zenbao Logo" class="logo-img">
            </div>

            <a href="menu.html" class="btn-menu">Menú</a>

        </div>
    </main>

    <script>
        // Permite que al hacer clic en cualquier parte de la pantalla redirija a menu.html
        document.body.addEventListener('click', function() {
            window.location.href = 'menu.html';
        });
    </script>

</body>
</html>
