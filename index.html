<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenbao - Bienvenida</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* RESET GENERAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL */
        .welcome-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .welcome-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 500px;
            width: 100%;
            /* Animación de entrada suave con difuminado */
            animation: fadeInBlur 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* LOGO SIN LUZ TRASERA Y CON MÁS ESPACIO INFERIOR */
        .logo-box {
            position: relative;
            margin-bottom: 50px; /* Mayor separación entre el logo y el botón */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-img {
            position: relative;
            z-index: 2;
            width: 260px;
            height: auto;
            object-fit: contain;
        }

        /* BOTÓN DE MENÚ */
        .btn-menu {
            position: relative;
            z-index: 2;
            display: inline-block;
            padding: 14px 42px;
            border: 1.5px solid #ffffff;
            border-radius: 8px;
            background-color: transparent;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 400;
            text-decoration: none;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-menu:hover {
            background-color: #d63031;
            border-color: #d63031;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(214, 48, 49, 0.6);
            transform: translateY(-2px);
        }

        /* ANIMACIÓN DE ENTRADA */
        @keyframes fadeInBlur {
            0% {
                opacity: 0;
                filter: blur(12px);
                transform: scale(0.96);
            }
            100% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1);
            }
        }

        /* MÓVILES */
        @media (max-width: 480px) {
            .logo-img {
                width: 210px;
            }
            .logo-box {
                margin-bottom: 45px; /* Separación ajustada para pantallas pequeñas */
            }
        }
    </style>
</head>
<body>

    <main class="welcome-container">
        <div class="welcome-content">
            
            <div class="logo-box">
                <img src="img/LogoZenbaoB.png" alt="Zenbao Logo" class="logo-img">
            </div>

            <a href="menu.html" class="btn-menu">Ver Menú</a>

        </div>
    </main>

</body>
</html>
